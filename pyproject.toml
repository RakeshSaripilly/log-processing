[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ulpf"
version = "2.0.0"
description = "Universal Log Pre-processing Framework (ULPF) - Production CLI & Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "cryptography>=41.0.0",
    "zstandard>=0.22.0",
    "pyyaml>=6.0",
    "drain3>=0.9.11",
]

[project.scripts]
ulpf = "core.cli:main"
