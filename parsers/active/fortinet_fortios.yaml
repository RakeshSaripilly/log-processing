name: Fortinet FortiGate FortiOS
vendor: Fortinet
product: FortiGate
version: "7.2"
class_uid: 4001
category_uid: 4
detection:
  contains:
    - "type=traffic"
    - "devname="
decoders:
  - keyvalue
mappings:
  srcip: src_endpoint.ip
  dstip: dst_endpoint.ip
  srcport: src_endpoint.port
  dstport: dst_endpoint.port
  action: activity_name
  proto: connection_info.protocol_num
  devname: device.hostname
labels:
  - firewall
  - fortinet
  - fortigate
fixtures:
  - raw: 'date=2026-09-26 time=12:30:00 devname="FG-CORP-01" devid="FG100E4Q17000123" type=traffic subtype=forward level=notice srcip=192.168.10.55 srcport=54312 dstip=198.51.100.25 dstport=443 proto=6 action=accept policyid=12'
