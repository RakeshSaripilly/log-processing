name: RFC5424 Syslog Standard
vendor: IETF
product: Syslog
version: "RFC5424"
class_uid: 1001
category_uid: 1
detection:
  patterns:
    - "^<\\d{1,3}>1\\s+"
decoders:
  - syslog_rfc5424
mappings:
  hostname: device.hostname
  app: metadata.product.name
  procid: process.pid
  msgid: metadata.event_code
  message: message
labels:
  - syslog
  - standard
  - rfc5424
fixtures:
  - raw: "<165>1 2026-09-26T22:14:15.003Z edge-firewall.corp.net myproc 1245 ID47 [exampleSDID@32473 iut=\"3\" eventSource=\"Application\"] Connection established with remote peer"
