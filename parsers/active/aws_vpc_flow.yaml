name: AWS VPC Flow Logs
vendor: AWS
product: VPC Flow
version: "2"
class_uid: 4001
category_uid: 4
detection:
  patterns:
    - "^2\\s+\\d+\\s+eni-[a-f0-9]+\\s+\\d+\\.\\d+\\.\\d+\\.\\d+\\s+\\d+\\.\\d+\\.\\d+\\.\\d+\\s+\\d+\\s+\\d+"
decoders:
  - csv
mappings:
  col_3: src_endpoint.ip
  col_4: dst_endpoint.ip
  col_5: src_endpoint.port
  col_6: dst_endpoint.port
  col_7: connection_info.protocol_num
  col_12: activity_name
labels:
  - cloud
  - aws
  - vpc
fixtures:
  - raw: "2 123456789012 eni-0123456789abcdef0 198.51.100.12 203.0.113.88 49152 443 6 20 4200 1695730000 1695730060 ACCEPT OK"
